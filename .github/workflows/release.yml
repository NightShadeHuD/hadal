name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (unused when triggered by a v* tag)"
        required: false
        default: "0.0.0-dryrun"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # macos-13/macos-14 are not available to this repository, so both mac
          # legs run on macos-latest (arm64). Only the arm64 artifact can be
          # executed natively there; the x86_64 artifact is cross-built and
          # verified with `file` plus the arch check instead of a run.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      # musl builds need an explicitly pinned C compiler/linker; Rust defaults to
      # the host glibc gcc, which produces binaries that cannot link statically.
      # The empty value on other matrix legs is ignored by cargo.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.target == 'x86_64-unknown-linux-musl' && 'musl-gcc' || '' }}
      CC_x86_64_unknown_linux_musl: ${{ matrix.target == 'x86_64-unknown-linux-musl' && 'musl-gcc' || '' }}
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain and the target triple this matrix leg builds for,
      # so `cargo build --target <triple>` has a std to link against.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p hadal --target ${{ matrix.target }}

      - name: Determine binary name
        id: binname
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            echo "name=hadal.exe" >> "$GITHUB_OUTPUT"
          else
            echo "name=hadal" >> "$GITHUB_OUTPUT"
          fi

      # Execute the artifact natively where the runner matches the target arch.
      - name: Smoke test --version
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ steps.binname.outputs.name }} --version

      # Can't execute an x86_64 mac binary on an arm64 runner without knowing
      # Rosetta is installed, so verify the cross-built artifact structurally.
      - name: Verify cross-compiled x86_64 artifact
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ steps.binname.outputs.name }}"
          file "${BIN}"
          file "${BIN}" | grep -q 'x86_64'
          test -x "${BIN}"

      - name: Create archive
        id: archive
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ inputs.version }}"
          fi
          TARGET=${{ matrix.target }}
          BIN=${{ steps.binname.outputs.name }}
          ARCHIVE="hadal-${VERSION}-${TARGET}"

          mkdir -p "${ARCHIVE}"
          cp "target/${TARGET}/release/${BIN}" "${ARCHIVE}/"

          cp LICENSE-MIT "${ARCHIVE}/" 2>/dev/null || true
          cp LICENSE-APACHE "${ARCHIVE}/" 2>/dev/null || true
          cp README.md "${ARCHIVE}/" 2>/dev/null || true

          if [[ "${TARGET}" == *"windows"* ]]; then
            HASH=$(sha256sum "${ARCHIVE}/${BIN}" | cut -d' ' -f1)
          else
            HASH=$(shasum -a 256 "${ARCHIVE}/${BIN}" | cut -d' ' -f1)
          fi
          echo "${HASH}  ${BIN}" > "${ARCHIVE}/SHA256SUMS"

          if [[ "${TARGET}" == *"windows"* ]]; then
            7z a "${ARCHIVE}.zip" "${ARCHIVE}/*"
            FILE="${ARCHIVE}.zip"
          else
            tar -czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
            FILE="${ARCHIVE}.tar.gz"
          fi
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"

          # Sidecar checksum of the archive itself, consumed by the installers
          # (scripts/install.* download hadal-<version>-<target>.sha256).
          if [[ "${TARGET}" == *"windows"* ]]; then
            ARCHIVE_HASH=$(sha256sum "${FILE}" | cut -d' ' -f1)
          else
            ARCHIVE_HASH=$(shasum -a 256 "${FILE}" | cut -d' ' -f1)
          fi
          echo "${ARCHIVE_HASH}  ${FILE}" > "${ARCHIVE}.sha256"
          echo "checksum=${ARCHIVE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.file }}
          path: |
            ${{ steps.archive.outputs.file }}
            ${{ steps.archive.outputs.checksum }}
          retention-days: 7

  release:
    needs: build
    # A workflow_dispatch dry run only builds and uploads artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hadal-*
          path: releases/
          # download-artifact nests one directory per artifact by default, which
          # would leave releases/hadal-*/*.tar.gz and break the glob below.
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          gh release create "${VERSION}" \
            --title "HADAL ${VERSION}" \
            --generate-notes \
            releases/hadal-*.tar.gz \
            releases/hadal-*.zip \
            releases/hadal-*.sha256
